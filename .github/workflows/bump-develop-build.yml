name: Mark Develop WIP Build

on:
  push:
    branches:
      - develop

concurrency:
  # Shared with the main-PR metadata workflow so both jobs can not write the
  # develop branch at the same time.
  group: release-metadata-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  bump-develop-build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mark WIP version and bump build
        run: |
          set -euo pipefail

          ABOUT_FILE="AE pyTools.extension/AE pyTools.Tab/CED Tools.panel/About.pushbutton/about.yaml"
          BUILD_TS="$(date -u +'%Y%m%d+%H%M')"

          if [[ ! -f "${ABOUT_FILE}" ]]; then
            echo "::error::Metadata file not found: ${ABOUT_FILE}"
            exit 1
          fi

          python3 .github/scripts/update_release_metadata.py \
            --file "${ABOUT_FILE}" \
            --build "${BUILD_TS}" \
            --mark-wip

          read_file_key() {
            local key="$1"
            sed -n -E "s/^${key}:[[:space:]]*([^[:space:]]+).*/\\1/p" "${ABOUT_FILE}" | head -n1
          }

          FINAL_VERSION="$(read_file_key "toolbar_version" || true)"
          FINAL_BUILD="$(read_file_key "build" || true)"

          git add "${ABOUT_FILE}"

          if git diff --cached --quiet; then
            echo "::notice::No build metadata change detected."
            exit 0
          fi

          COMMIT_MESSAGE="Bot: WIP build bumped to ${FINAL_VERSION}-${FINAL_BUILD}"
          git commit -m "${COMMIT_MESSAGE}"
          git push origin HEAD:develop
          echo "::notice::Pushed metadata commit: ${COMMIT_MESSAGE}"
