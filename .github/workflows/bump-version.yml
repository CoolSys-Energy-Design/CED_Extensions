name: Prepare and Validate Release Metadata

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches:
      - main

concurrency:
  # This matches the develop push workflow when the PR head is develop. A WIP
  # bump and a release preparation can therefore never push at the same time.
  group: release-metadata-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  validate-release-metadata:
    # Preserve the existing required-check name while making its steps ordered.
    name: validate-release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Resolve PR and release-label context
        id: prctx
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const releaseLabels = new Set([
              "release: major",
              "release: minor",
              "release: patch",
              "release: none"
            ]);

            if (!pr || pr.base.ref !== "main") {
              core.setFailed("This workflow only supports pull requests targeting main.");
              return;
            }
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("Release metadata can only be prepared on a branch in this repository.");
              return;
            }

            const matches = pr.labels
              .map(label => String(label.name || "").toLowerCase())
              .filter(label => releaseLabels.has(label));
            const changedLabel = String(context.payload.label?.name || "").toLowerCase();
            const releaseLabelChanged = releaseLabels.has(changedLabel);
            const shouldPrepare = matches.length === 1 && (
              (context.payload.action === "labeled" && releaseLabelChanged) ||
              (context.payload.action === "unlabeled" && releaseLabelChanged)
            );

            core.setOutput("number", String(pr.number));
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("base_ref", pr.base.ref);
            core.setOutput("release_label_count", String(matches.length));
            core.setOutput("release_label", matches.length === 1 ? matches[0] : "");
            core.setOutput("should_prepare", shouldPrepare ? "true" : "false");

            core.notice(`PR #${pr.number}: ${pr.head.ref} -> ${pr.base.ref}`);
            core.notice(`Release labels: ${matches.join(", ") || "none"}`);
            if (shouldPrepare) {
              core.notice("A release label changed; metadata will be prepared before validation.");
            } else {
              core.notice("Validation-only run. Add or reapply the release label in the PR sidebar to prepare metadata.");
            }

      - name: Checkout latest PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.prctx.outputs.head_ref }}
          fetch-depth: 0

      - name: Resolve expected release metadata
        env:
          TARGET_BRANCH: ${{ steps.prctx.outputs.base_ref }}
          PR_BRANCH: ${{ steps.prctx.outputs.head_ref }}
          RELEASE_LABEL_COUNT: ${{ steps.prctx.outputs.release_label_count }}
          RELEASE_LABEL: ${{ steps.prctx.outputs.release_label }}
        run: |
          set -euo pipefail

          ABOUT_FILE="AE pyTools.extension/AE pyTools.Tab/CED Tools.panel/About.pushbutton/about.yaml"

          read_ref_key() {
            local git_ref="$1"
            local key="$2"
            git show "${git_ref}:${ABOUT_FILE}" | sed -n -E "s/^${key}:[[:space:]]*([^[:space:]]+).*/\1/p" | head -n1
          }

          git fetch --no-tags origin "${TARGET_BRANCH}" "${PR_BRANCH}"

          BASE_VERSION="$(read_ref_key "origin/${TARGET_BRANCH}" "toolbar_version" || true)"
          BASE_BUILD="$(read_ref_key "origin/${TARGET_BRANCH}" "build" || true)"

          if [[ ! "${BASE_VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::main must contain a stable X.Y.Z toolbar_version. Found '${BASE_VERSION}'."
            exit 1
          fi
          BASE_MAJOR="${BASH_REMATCH[1]}"
          BASE_MINOR="${BASH_REMATCH[2]}"
          BASE_PATCH="${BASH_REMATCH[3]}"
          if [[ ! "${BASE_BUILD}" =~ ^[0-9]{8}\+[0-9]{4}$ ]]; then
            echo "::error::main contains an invalid build value: '${BASE_BUILD}'."
            exit 1
          fi

          EXPECTED_VERSION=""
          if [[ "${RELEASE_LABEL_COUNT}" == "1" ]]; then
            case "${RELEASE_LABEL}" in
              "release: major") EXPECTED_VERSION="$((BASE_MAJOR + 1)).0.0" ;;
              "release: minor") EXPECTED_VERSION="${BASE_MAJOR}.$((BASE_MINOR + 1)).0" ;;
              "release: patch") EXPECTED_VERSION="${BASE_MAJOR}.${BASE_MINOR}.$((BASE_PATCH + 1))" ;;
              "release: none")  EXPECTED_VERSION="${BASE_VERSION}" ;;
              *)
                echo "::error::Unexpected release label '${RELEASE_LABEL}'."
                exit 1
                ;;
            esac
          fi

          {
            echo "ABOUT_FILE=${ABOUT_FILE}"
            echo "BASE_VERSION=${BASE_VERSION}"
            echo "BASE_BUILD=${BASE_BUILD}"
            echo "EXPECTED_VERSION=${EXPECTED_VERSION}"
          } >> "${GITHUB_ENV}"

          echo "::notice::Base metadata: ${BASE_VERSION}-${BASE_BUILD}"
          if [[ -n "${EXPECTED_VERSION}" ]]; then
            echo "::notice::Expected release version: ${EXPECTED_VERSION}"
          fi

      - name: Configure git for metadata commit
        if: steps.prctx.outputs.should_prepare == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release metadata
        if: steps.prctx.outputs.should_prepare == 'true'
        env:
          PR_BRANCH: ${{ steps.prctx.outputs.head_ref }}
        run: |
          set -euo pipefail

          if [[ -z "${EXPECTED_VERSION}" ]]; then
            echo "::error::No expected release version was resolved."
            exit 1
          fi

          BUILD_TS="$(date -u +'%Y%m%d+%H%M')"
          python3 .github/scripts/update_release_metadata.py \
            --file "${ABOUT_FILE}" \
            --build "${BUILD_TS}" \
            --toolbar-version "${EXPECTED_VERSION}"

          git add "${ABOUT_FILE}"
          if git diff --cached --quiet; then
            echo "::notice::Release metadata already matches; no commit required."
          else
            COMMIT_MESSAGE="Bot: prepare release ${EXPECTED_VERSION}-${BUILD_TS}"
            git commit -m "${COMMIT_MESSAGE}"
            git push origin "HEAD:${PR_BRANCH}"
            echo "::notice::Pushed metadata commit: ${COMMIT_MESSAGE}"
          fi

      - name: Validate release metadata
        env:
          RELEASE_LABEL_COUNT: ${{ steps.prctx.outputs.release_label_count }}
        run: |
          set -euo pipefail

          read_file_key() {
            local key="$1"
            sed -n -E "s/^${key}:[[:space:]]*([^[:space:]]+).*/\1/p" "${ABOUT_FILE}" | head -n1
          }

          if [[ "${RELEASE_LABEL_COUNT}" != "1" ]]; then
            echo "::error::Select exactly one release label in the PR sidebar: release: major, minor, patch, or none. Found ${RELEASE_LABEL_COUNT}."
            exit 1
          fi

          CURRENT_VERSION="$(read_file_key "toolbar_version" || true)"
          CURRENT_BUILD="$(read_file_key "build" || true)"

          if [[ "${CURRENT_VERSION}" != "${EXPECTED_VERSION}" ]]; then
            echo "::error::Expected toolbar_version ${EXPECTED_VERSION}, found ${CURRENT_VERSION}. Remove and reapply the release label in the PR sidebar to prepare metadata."
            exit 1
          fi
          if [[ ! "${CURRENT_BUILD}" =~ ^[0-9]{8}\+[0-9]{4}$ ]]; then
            echo "::error::build must match YYYYMMDD+hhmm. Found '${CURRENT_BUILD}'."
            exit 1
          fi
          if [[ "${CURRENT_BUILD}" == "${BASE_BUILD}" ]]; then
            echo "::error::build was not bumped from main (${BASE_BUILD}). Remove and reapply the release label in the PR sidebar."
            exit 1
          fi

          echo "::notice::Validated release metadata: ${CURRENT_VERSION}-${CURRENT_BUILD}."
          {
            echo "### Release metadata"
            echo ""
            echo "Prepared and validated \`${CURRENT_VERSION}-${CURRENT_BUILD}\` from \`${BASE_VERSION}\`."
          } >> "${GITHUB_STEP_SUMMARY}"
